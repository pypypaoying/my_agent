[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agent-learning"
version = "0.1.0"
description = "Personal Hello-Agents exercises and learning journal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=1,<2", "python-dotenv>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]
